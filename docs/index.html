<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Digest</title>
<style>
  :root {
    --bg: #f1f3f0;
    --surface: #ffffff;
    --ink: #16211d;
    --ink-muted: #5c6b66;
    --line: #d3d9d5;
    --accent: #0d7a72;
    --accent-ink: #ffffff;
    --warn: #b5762a;
    --critical: #a63d34;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'URW Palladio L', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101613; --surface: #182019; --ink: #e6ece8; --ink-muted: #8fa39c;
      --line: #28332e; --accent: #3fd9c7; --accent-ink: #0a1512; --warn: #d99a4e; --critical: #d9695d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101613; --surface: #182019; --ink: #e6ece8; --ink-muted: #8fa39c;
    --line: #28332e; --accent: #3fd9c7; --accent-ink: #0a1512; --warn: #d99a4e; --critical: #d9695d;
  }
  :root[data-theme="light"] {
    --bg: #f1f3f0; --surface: #ffffff; --ink: #16211d; --ink-muted: #5c6b66;
    --line: #d3d9d5; --accent: #0d7a72; --accent-ink: #ffffff; --warn: #b5762a; --critical: #a63d34;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 96px; }
  header.masthead { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
  header.masthead h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.9rem;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  header.masthead .date-line {
    color: var(--ink-muted);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  nav.tabs { display: flex; gap: 4px; margin: 20px 0 12px; }
  nav.tabs button {
    font-family: var(--font-body);
    font-size: 0.9rem;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    padding: 6px 14px;
    cursor: pointer;
  }
  nav.tabs button[aria-selected="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .chip {
    font-family: var(--font-body);
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    background: none;
    padding: 4px 10px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #date-chips:empty { display: none; }
  .settings-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--ink-muted);
    border: 1px solid var(--line);
    padding: 6px 12px;
    margin: 16px 0;
  }
  .settings-bar button {
    font-family: var(--font-body);
    font-size: 0.78rem;
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .settings-panel { border: 1px solid var(--line); padding: 14px; margin: 0 0 16px; }
  .settings-panel[hidden] { display: none; }
  .settings-panel .field { margin-bottom: 14px; }
  .settings-panel .field:last-child { margin-bottom: 0; }
  .settings-panel label.field-label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .settings-panel input[type="range"] { width: 100%; }
  .settings-panel select {
    font-family: var(--font-body);
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .settings-panel .day-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .settings-error { font-size: 0.75rem; color: var(--critical); margin-top: 8px; }
  .calendar-month { margin-top: 10px; }
  .calendar-heading { font-size: 0.8rem; font-weight: 600; text-align: center; margin-bottom: 6px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 0.75rem; }
  .calendar-dow { color: var(--ink-muted); text-transform: uppercase; font-size: 0.65rem; padding: 2px 0; }
  .calendar-cell { padding: 5px 0; border: 1px solid var(--line); cursor: pointer; }
  .calendar-cell.empty { border: none; cursor: default; }
  .calendar-cell.disabled { opacity: 0.3; cursor: not-allowed; }
  .calendar-cell.selected {
    border: 2px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    font-weight: 700;
  }
  .clear-dates-link {
    font-family: var(--font-body);
    font-size: 0.75rem;
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-top: 8px;
  }
  .archive-date {
    font-family: var(--font-body);
    font-size: 0.78rem;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 28px 0 8px;
  }
  .card { border-top: 1px solid var(--line); padding: 18px 0; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .card-head-main { flex: 1; }
  .card h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.15rem;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .card .meta {
    font-size: 0.78rem;
    color: var(--ink-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .card .meta .tag { text-transform: uppercase; letter-spacing: 0.03em; }
  .card p.summary { margin: 0; max-width: 62ch; }
  .card .actions { display: flex; gap: 8px; margin-top: 10px; }
  .card .actions button {
    font-family: var(--font-body);
    font-size: 0.75rem;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    padding: 4px 10px;
    cursor: pointer;
  }
  .card .actions button.active-used { border-color: var(--accent); color: var(--accent); }
  .card .actions button.active-skip { border-color: var(--critical); color: var(--critical); }
  .card .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .actions .mark-error { font-size: 0.75rem; color: var(--critical); align-self: center; }
  .card.marked-skip { opacity: 0.55; }
  .detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 0.85rem; }
  .card.expanded .detail { display: block; }
  .detail dt { color: var(--ink-muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.04em; margin-top: 10px; }
  .detail dt:first-child { margin-top: 0; }
  .detail dd { margin: 2px 0 0; }
  .detail ol { margin: 4px 0 0; padding-left: 20px; }
  .detail a { color: var(--accent); }
  .empty-state { padding: 48px 0; text-align: center; color: var(--ink-muted); font-family: var(--font-display); font-size: 1.1rem; }
  a.outlink { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
  a.outlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Research Digest</h1>
    <div class="date-line" id="date-line"></div>
  </header>

  <div class="settings-bar">
    <span id="settings-summary"></span>
    <button type="button" id="settings-edit-btn">Edit</button>
  </div>
  <div class="settings-panel" id="settings-panel" hidden></div>

  <nav class="tabs" role="tablist">
    <button type="button" id="tab-today" role="tab" aria-selected="true">Today</button>
    <button type="button" id="tab-archive" role="tab" aria-selected="false">Archive</button>
  </nav>

  <div class="chips" id="chips"></div>
  <div class="chips" id="date-chips"></div>

  <main id="feed"></main>
</div>

<script id="papers-data" type="application/json">[{"id": "lancet-2026-cure-trial-spina-bifida", "title": "Feasibility and safety of cellular therapy for in-utero repair of myelomeningocele (CuRe Trial): a first-in-human, phase 1, single-arm study", "link": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(25)02466-3/fulltext", "summary": "Surgeons at UC Davis applied allogeneic human placenta-derived mesenchymal stem cells directly onto the exposed spinal cord during standard fetal surgery for six fetuses with severe spina bifida (myelomeningocele). All six children were born with intact repairs, no cell-related adverse effects, and reversal of the hindbrain herniation typically associated with the condition. It is the first time a live cellular therapy has been delivered in utero, and the results support advancing to a larger phase 1/2a cohort.", "journal": "The Lancet", "year": 2026, "category": "cell_therapy", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and thelancet.com: no retractions, corrections, or PubPeer threads found as of 2026-07-24.", "citation_count": 5, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "cellstemcell-2026-laromestrocel-frailty", "title": "Randomized phase 2b dose-escalation trial of stem cell therapy with laromestrocel for aging frailty", "link": "https://www.cell.com/cell-stem-cell/fulltext/S1934-5909(26)00040-8", "summary": "In a 148-person randomized trial, a single IV infusion of allogeneic bone-marrow-derived mesenchymal stem cells (laromestrocel) produced dose- and time-dependent gains in 6-minute-walk distance versus placebo in adults aged 70-85 with clinical frailty, with the largest doses adding roughly 63 meters at 9 months. It is among the largest controlled trials to date testing an off-the-shelf allogeneic cell therapy against a hallmark of biological aging rather than a single disease.", "journal": "Cell Stem Cell", "year": 2026, "category": "cell_therapy", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and cell.com: no retractions or corrections found as of 2026-07-24. Note: the independent commentary site 'The Niche' (Paul Knoepfler, March 2026) raised methodological questions about an unexplained decline in the placebo group's walk-test scores between months 3 and 9, and criticized overselling in accompanying press coverage -- this is post-publication commentary, not a peer-reviewed correction.", "citation_count": 5, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "nejm-2026-biovat-hf-heart-patch", "title": "Stem-Cell-Derived Biologic Ventricular Assist Tissue in Heart Failure", "link": "https://www.nejm.org/doi/full/10.1056/NEJMoa2513525", "summary": "In the ongoing BioVAT-HF trial, 20 patients with advanced heart failure received an implanted patch of induced-pluripotent-stem-cell-derived engineered heart muscle sewn onto the epicardium. At 3 months the grafts thickened the treated heart wall by 4.5 mm and improved ejection fraction and quality-of-life scores, with benefits partly sustained out to 36 months in long-term follow-up. It is one of the first controlled trials showing an iPSC-derived tissue graft can measurably remuscularize a failing human heart.", "journal": "New England Journal of Medicine", "year": 2026, "category": "regenerative_medicine", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and nejm.org: no retractions or corrections found as of 2026-07-24.", "citation_count": 1, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "nejm-2026-daraxonrasib-pancreatic-cancer", "title": "Daraxonrasib or Chemotherapy in Previously Treated Metastatic Pancreatic Cancer", "link": "https://www.nejm.org/doi/full/10.1056/NEJMoa2605555", "summary": "The phase 3 RASolute 302 trial randomized patients with previously treated metastatic pancreatic ductal adenocarcinoma to daraxonrasib, an oral pan-RAS(ON) inhibitor, or standard chemotherapy. Daraxonrasib nearly doubled median overall survival (13.2 vs 6.7 months, hazard ratio 0.40) along with improved progression-free survival, a magnitude of benefit described by investigators as unprecedented for this cancer. Dermatologic toxicity and emerging resistance via KRAS amplification and other pathway alterations remain open challenges.", "journal": "New England Journal of Medicine", "year": 2026, "category": "clinical_trial", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and nejm.org: no retractions or corrections found as of 2026-07-24.", "citation_count": 8, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "nature-2025-brain-wide-map-decision-making", "title": "A brain-wide map of neural activity during complex behaviour", "link": "https://www.nature.com/articles/s41586-025-09235-0", "summary": "The International Brain Laboratory, a 12-lab consortium, recorded from more than 600,000 neurons across 279 brain regions in 139 mice performing a decision-making task, producing the first standardized, brain-wide activity atlas of its kind. Task-related and movement-related signals were found to be far more broadly distributed across the brain than prior single-region studies suggested. The underlying dataset and pipeline are openly released, and the finding has already reshaped how the field designs region-specific versus brain-wide circuit studies.", "journal": "Nature", "year": 2025, "category": "neuroscience", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and nature.com: no retractions or corrections found as of 2026-07-24.", "citation_count": 166, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "nature-2026-evo2-genome-model", "title": "Genome modelling and design across all domains of life with Evo 2", "link": "https://www.nature.com/articles/s41586-026-10176-5", "summary": "Evo 2 is a 40-billion-parameter DNA foundation model trained on over 9 trillion nucleotides spanning all domains of life, capable of predicting variant effects and generating synthetic genomic sequences from DNA to RNA to protein. Arc Institute and collaborators showed it can classify pathogenic mutations zero-shot and design functional genetic elements without task-specific fine-tuning. It has become one of the most widely used open genomic foundation models since its 2025 preprint release, though independent benchmarks have since identified specific blind spots.", "journal": "Nature", "year": 2026, "category": "ai_biology", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and nature.com: no retractions or corrections found as of 2026-07-24.", "citation_count": 110, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": [{"title": "Fundamental limitations of genomic language models for realistic sequence generation", "link": "https://www.biorxiv.org/content/10.64898/2026.01.17.700093.full.pdf"}, {"title": "Benchmarking DNA Foundation Models: Biological Blind Spots in Genomic Language Models", "link": "https://www.biorxiv.org/content/10.64898/2026.03.10.710786v1.full.pdf"}]}, {"id": "natneuro-2026-braingate-typing-neuroprosthesis", "title": "Restoring rapid natural bimanual typing with a neuroprosthesis after paralysis", "link": "https://www.nature.com/articles/s41593-026-02218-y", "summary": "BrainGate investigators built an intracortical brain-computer interface that decodes attempted finger movements on a QWERTY layout, letting two participants -- one with ALS, one with a cervical spinal cord injury -- type at up to 22 words per minute with a 1.6% word error rate, approaching able-bodied typing accuracy. This is a substantial throughput jump over prior hand-motor intracortical BCI decoders and moves implanted typing interfaces closer to practical, everyday communication for people with paralysis.", "journal": "Nature Neuroscience", "year": 2026, "category": "biomedical_devices", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and nature.com: no retractions or corrections found as of 2026-07-24.", "citation_count": 6, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "nejm-2025-cps1-gene-editing-baby-kj", "title": "Patient-Specific In Vivo Gene Editing to Treat a Rare Genetic Disease", "link": "https://www.nejm.org/doi/full/10.1056/NEJMoa2504747", "summary": "A CHOP/Penn team designed, manufactured, and administered a bespoke in vivo CRISPR base-editing therapy for an infant (\"KJ\") with life-threatening carbamoyl phosphate synthetase 1 (CPS1) deficiency in under six months, using lipid nanoparticles to deliver a base editor targeted to his specific mutation. After two infusions the child tolerated substantially more dietary protein and a lower dose of nitrogen-scavenger medication with no serious adverse events. It is the first published case of a fully individualized, patient-specific gene-editing drug, though it is a single-patient case study and experts have flagged open questions about manufacturing scalability and regulatory pathways for replicating the approach.", "journal": "New England Journal of Medicine", "year": 2025, "category": "gene_therapy", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and nejm.org: no retractions or corrections found as of 2026-07-24.", "citation_count": 197, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "cellstemcell-2025-vid-scaffolds-midbrain-organoids", "title": "Vascular network-inspired diffusible scaffolds for engineering functional midbrain organoids", "link": "https://www.cell.com/cell-stem-cell/fulltext/S1934-5909(25)00049-9", "summary": "Standard neural organoids suffer necrotic, hypoxic cores because nutrients and oxygen can only diffuse in from the surface. This group 3D-printed vascular-network-inspired diffusible (VID) scaffolds -- meshed tubular channel networks -- into culture wells, letting midbrain organoids grow with far less necrosis and hypoxia, along with better dopaminergic neuron maturation, more complex network activity, and more physiologically realistic drug responses. It's a low-tech, broadly adoptable alternative to microfluidic or vascularized-implant approaches for solving organoid diffusion limits.", "journal": "Cell Stem Cell", "year": 2025, "category": "tissue_engineering", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and cell.com: no retractions or corrections found as of 2026-07-24.", "citation_count": 38, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "cell-2026-tscm-car-t-cells", "title": "Distinct in vivo dynamics of donor-derived stem cell memory CAR T cells post-allogeneic HSCT relapse", "link": "https://www.cell.com/cell/fulltext/S0092-8674(26)00383-1", "summary": "Researchers co-led by Luca Gattinoni and James Kochenderfer engineered CAR T cells that acquire a stem-cell-memory (TSCM) phenotype and tested them in a first-in-human trial in patients relapsing after allogeneic stem cell transplant. The TSCM-phenotype CAR T cells expanded and persisted markedly better than conventional CAR T products, driving complete responses at doses as low as 250,000 cells/kg without lymphodepleting chemotherapy beforehand. Lower effective doses and no chemo preconditioning could translate into a substantially safer, less toxic CAR-T regimen if the results hold up in larger cohorts.", "journal": "Cell", "year": 2026, "category": "cell_therapy", "date_surfaced": "2026-07-24", "retraction_status": "Checked Retraction Watch, PubPeer, and cell.com: no retractions or corrections found as of 2026-07-24.", "citation_count": 5, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-24", "contradicting_papers": []}, {"id": "natmed-2026-stempd-parkinsons-dopaminergic-cells", "title": "Human embryonic stem cell-derived dopaminergic cells for Parkinson's disease: a phase 1/2 open-label trial", "link": "https://www.nature.com/articles/s41591-026-04525-0", "summary": "In this first-in-human European trial, researchers transplanted dopamine-producing neurons grown from human embryonic stem cells directly into the brains of eight people with moderate Parkinson's disease. After 12 months of follow-up under immunosuppression, the cell product caused no serious product-related adverse events and no graft-induced dyskinesia, a major feasibility milestone for replacing the neurons lost in Parkinson's disease with lab-grown cells. One of eight participants died from an unrelated pulmonary infection during follow-up, not attributed to the cell product. The trial is among the first pluripotent stem-cell therapies for Parkinson's approved for clinical testing in Europe.", "journal": "Nature Medicine", "year": 2026, "category": "cell_therapy", "date_surfaced": "2026-07-25", "retraction_status": "Checked Retraction Watch, PubPeer, and the Nature Medicine site directly on 2026-07-25: no retraction, correction, or expression of concern found.", "citation_count": 0, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "pnas-2026-digit-regeneration-gene-delivery", "title": "Enhancer-directed gene delivery for digit regeneration based on conserved epidermal factors", "link": "https://www.pnas.org/doi/10.1073/pnas.2532804123", "summary": "Comparing regenerating zebrafish fins, salamander limbs, and mouse digit tips, researchers found that the transcription factors SP6 and SP8 act as a conserved genetic switch in wound skin that drives appendage regrowth, and that removing them blocks bony digit-tip regeneration in mice. They then packaged an AAV gene therapy carrying a zebrafish-derived regeneration enhancer to deliver FGF8, a downstream SP target, directly to amputation wounds, partially restoring regeneration in SP-deficient mice and accelerating it in normal mice. It is an early proof-of-concept for injury-site-specific gene therapy that could one day help regrow lost digit or limb tissue.", "journal": "Proceedings of the National Academy of Sciences (PNAS)", "year": 2026, "category": "regenerative_medicine", "date_surfaced": "2026-07-25", "retraction_status": "Checked Retraction Watch, PubPeer, and the PNAS site directly on 2026-07-25: no retraction or correction found.", "citation_count": 0, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "nature-2025-pig-kidney-xenotransplant-decedent", "title": "Physiology and immunology of a pig-to-human decedent kidney xenotransplant", "link": "https://www.nature.com/articles/s41586-025-09847-6", "summary": "Surgeons transplanted a minimally gene-edited pig kidney into a brain-dead human maintained on a ventilator for a pre-planned 61-day study, the longest such xenotransplant physiology study to date. The kidney sustained hemodynamic and electrolyte stability and dialysis independence for weeks; antibody-mediated rejection emerged around day 33 but was fully reversed with plasma exchange, complement inhibition, and anti-thymocyte globulin. The study demonstrates both the promise and the immunological hurdles of pig-to-human kidney xenotransplantation as a potential answer to the organ-donor shortage.", "journal": "Nature", "year": 2025, "category": "regenerative_medicine", "date_surfaced": "2026-07-25", "retraction_status": "Checked Retraction Watch, PubPeer, and Nature's site on 2026-07-25: no retraction found. Note a Publisher Correction (2026-02-12) and an Author Correction (2026-06-04) fixing mislabeled cell-frequency percentages in an extended data figure (e.g. a value corrected from '48%' to '0.48%'); these are figure-data corrections that do not affect the paper's core conclusions.", "citation_count": 29, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": [{"title": "Immune profiling in a living human recipient of a gene-edited pig kidney", "link": "https://www.nature.com/articles/s41591-025-04053-3"}]}, {"id": "nejm-2026-ascent04-sacituzumab-pembrolizumab-tnbc", "title": "Sacituzumab Govitecan plus Pembrolizumab for Advanced Triple-Negative Breast Cancer", "link": "https://www.nejm.org/doi/full/10.1056/NEJMoa2508959", "summary": "This international phase 3 trial (443 patients across 186 sites in 28 countries) tested whether adding the antibody-drug conjugate sacituzumab govitecan to the immunotherapy drug pembrolizumab works better than standard chemotherapy plus pembrolizumab as first-line treatment for PD-L1-positive metastatic triple-negative breast cancer. The combination cut the risk of progression or death by 35% (median progression-free survival 11.2 vs. 7.8 months) with a higher response rate and fewer treatment discontinuations. The FDA approved the combination in June 2026 based on these results, making it a likely new standard of care for this aggressive cancer subtype.", "journal": "New England Journal of Medicine", "year": 2026, "category": "clinical_trial", "date_surfaced": "2026-07-25", "retraction_status": "Checked Retraction Watch, PubPeer, and the NEJM site directly on 2026-07-25: no retraction or correction found.", "citation_count": 27, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "lancet-2026-evoke-semaglutide-alzheimers", "title": "Efficacy and safety of oral semaglutide 14 mg (flexible do r plasma membrane, dubbed a 'neuroproteasome', that normally keeps the Alzheimer's-linked protein tau from misfolding. Using a novel cell-impermeant inhibitor, they showed that blocking this neuroproteasome rapidly causes normal tau to misfold into paired helical filaments, the same structures found in Alzheimer's brains. The APOE4 gene variant, the strongest genetic Alzheimer's risk factor, reduces neuroproteasome levels at the membrane by about a third, while the protective APOE2 variant nearly doubles them, offering a mechanistic bridge between genetic risk, aging, and the onset of tau pathology.", "journal": "Nature Neuroscience", "year": 2026, "category": "neuroscience", "date_surfaced": "2026-07-25", "retraction_status": "Checked Retraction Watch, PubPeer, and the Nature Neuroscience site directly on 2026-07-25: no retraction, correction, or expression of concern found.", "citation_count": 1, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "nature-2026-alphagenome-variant-effect-prediction", "title": "Advancing regulatory variant effect prediction with AlphaGenome", "link": "https://www.nature.com/articles/s41586-025-10014-0", "summary": "DeepMind's AlphaGenome is a unified deep-learning model that reads up to one million base pairs of DNA and predicts thousands of molecular readouts, including gene expression, chromatin accessibility, histone marks, transcription-factor binding, 3D chromatin contacts, and splicing, at single-base resolution. It matches or beats specialized state-of-the-art models in 25 of 26 variant-effect benchmarks, and the authors show it can simultaneously explain multiple mechanisms behind clinically relevant mutations near the TAL1 oncogene. It is a discriminative regulatory-genomics model, distinct from generative sequence-design models such as Evo 2.", "journal": "Nature", "year": 2026, "category": "ai_biology", "date_surfaced": "2026-07-25", "retraction_status": "Check les/s41551-026-01618-6", "summary": "Bioengineers built a human iPSC-derived organ-on-chip system linking engineered white-adipose and liver tissue, then perfused it with blood serum from older versus younger human donors. Within four days, serum from older donors induced chronic inflammation, impaired glucose regulation, disrupted fat metabolism, and cellular senescence, hallmarks that normally take decades to develop in people, while young serum reversed some of these changes. The system is proposed as a fast, human-relevant platform for testing anti-aging interventions without waiting years for results.", "journal": "Nature Biomedical Engineering", "year": 2026, "category": "tissue_engineering", "date_surfaced": "2026-07-25", "retraction_status": "Checked Retraction Watch, PubPeer, and the Nature Biomedical Engineering site directly on 2026-07-25: no retraction, correction, or expression of concern found.", "citation_count": 1, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "nejm-2025-prime-editing-cgd-p47phox", "title": "Prime Editing for p47phox-Deficient Chronic Granulomatous Disease", "link": "https://www.nejm.org/doi/full/10.1056/NEJMoa2509807", "summary": "This paper reports the first peer-reviewed clinical use of prime editing, a 'search-and-replace' gene-editing technology that corrects mutations without cutting both DNA strands, in human patients. Two patients with p47phox-deficient chronic granulomatous disease, a severe inherited immune disorder, received an infusion of their own blood stem cells corrected with the prime editor PM359. Both patients showed restored NADPH oxidase immune activity within one month, sustained through 4-6 months of follow-up, with no clinically significant treatment-related adverse events.", "journal": "New England Journal of Medicine", "year": 2025, "category": "gene_therapy", "date_surfaced": "2026-07-25", "retraction_status": "Checked Retraction Watch, PubPeer, and the NEJM site directly on 2026-07-25: no retraction or correction found.", "citation_count": 7, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "nature-2024-drosophila-brain-model", "title": "A Drosophila computational brain model reveals sensorimotor processing", "link": "https://www.nature.com/articles/s41586-024-07763-9", "summary": "Using the newly completed FlyWire connectome (125,000+ neurons, ~50 million synapses) of the adult Drosophila central brain, Shiu, Sterne, Scott and colleagues built a leaky integrate-and-fire model that treats each neuron as a simple threshold unit wired according to measured synaptic connectivity and predicted neurotransmitter identity. Across 164 experimentally testable predictions about which neurons activate downstream of specific taste, water, or mechanosensory inputs, the model matched optogenetic and behavioral validation about 91% of the time, including circuits for feeding initiation and grooming sequences. It's a deliberately simple model — no neuromodulation, no spontaneous/basal firing, no learning — so it's best read as evidence that synapse-level wiring diagrams plus coarse dynamics already predict a surprising amount of circuit behavior, not as a full simulation of a working brain.", "journal": "Nature", "year": 2024, "category": "neuroscience", "date_surfaced": "2026-07-18", "retraction_status": "none found — checked Retraction Watch (no hits for search terms) and general PubPeer-targeted search (no discussion page found); no correction/erratum listed on the Nature article page as of 2026-07-25", "citation_count": 73, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "pnas-2026-decisional-reference-point-depression", "title": "Decisional reference point pathology: a cognitive mechanism for and a correlate of major depressive disorder in humans", "link": "https://pmc.ncbi.nlm.nih. lar cell types.", "journal": "Science", "year": 2023, "category": "neuroscience", "date_surfaced": "2026-07-18", "retraction_status": "no retraction or correction found (checked Science site, Retraction Watch, PubPeer as of 2026-07-25)", "citation_count": 611, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "nature-2024-alphafold3-biomolecular-structure", "title": "Accurate structure prediction of biomolecular interactions with AlphaFold 3", "link": "https://www.nature.com/articles/s41586-024-07487-w", "summary": "Diffusion-based successor to AlphaFold2 that jointly predicts structures of proteins in complex with nucleic acids, small-molecule ligands, ions, and chemically modified residues, substantially outperforming specialized docking and nucleic-acid-specific prediction tools on internal benchmarks. Independent third-party benchmarking published since found the accuracy advantage shrinks markedly for structures released after AlphaFold3's training cutoff and for chemically dissimilar ligands, suggesting part of the reported improvement reflects training-data memorization rather than pure generalization — a caveat worth flagging given how heavily the tool is now used in drug discovery pipelines.", "journal": "Nature", "year": 2024, "category": "ai_biology", "date_surfaced": "2026-07-18", "retraction_status": "No retraction. An Addendum was published (Nature 636, E4, Nov. 2024) correcting pseudocode in the Supplementary Information; this is a correction to supplementary methods documentation, not a retraction (checked Nature site, Retraction Watch, PubPeer as of 2026-07-25).", "citation_count": 12443, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": [{"title": "A comprehensive benchmarking of the AlphaFold3 for predicting biomacromolecules and their interactions", "link": "https://academic.oup.com/bib/article/26/6/bbaf616/8351050"}]}, {"id": "science-2025-esm3-protein-language-model", "title": "Simulating 500 million years of evolution with a language model", "link": "https://www.science.org/doi/10.1126/science.ads0018", "summary": "Introduces ESM3, a generative multimodal protein language model (up to 98 billion parameters, trained on ~2.8 billion natural protein sequences) that jointly reasons over sequence, structure, and function. Prompted to design a novel fluorescent protein, ESM3 generated a bright GFP variant only 58% sequence-identical to any known natural fluorescent protein — a jump the authors estimate is equivalent to roughly 500 million years of natural evolutionary divergence. Demonstrates that language models can be steered to explore functional protein space well beyond what evolution has actually sampled, though independent reviewers note zero-shot performance is inconsistent for highly divergent protein families and model confidence doesn't always track correctness.", "journal": "Science", "year": 2025, "category": "ai_biology", "date_surfaced": "2026-07-18", "retraction_status": "no retraction or correction found (checked Science site, Retraction Watch, PubPeer as of 2026-07-25)", "citation_count": 311, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-25", "contradicting_papers": []}, {"id": "nature-2025-bioresorbable-pacemaker", "title": "Millimetre-scale bioresorbable optoelectronic systems for electrotherapy", "link": "https://www.nature.com/articles/s41586-025-08726-4", "summary": "A grain-of-rice-sized, fully bioresorbable, wirelessly light-activated pacemaker (1.8 x 3.5 x 1 mm) paired with a soft skin-mounted sensor that autonomously fires a light pulse to trigger pacing when it detects a dangerously slow heart rate, then dissolves harmlessly in the body once no longer needed — e.g., during recovery from cardiac surgery. Eliminates the second surgery normally required to remove a temporary pacing wire, and at more than 20x smaller than the group's own prior b ctivity in patient-matched cells, organoids, and xenograft models, and in a first-in-human trial produced disease stabilization and shrinkage of non-target lesions in a patient with metastatic, treatment-refractory sarcoma, with good tolerability. The work offers a rare proof-of-concept for CAR-T efficacy against solid tumors, historically a major weak point for cellular immunotherapy.", "journal": "Nature Cancer", "year": 2026, "category": "cell_therapy", "date_surfaced": "2026-07-27", "retraction_status": "No retraction, correction, or PubPeer flags found as of 2026-07-27 (checked journal site, PubMed, and PubPeer).", "citation_count": 1, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-27", "contradicting_papers": []}, {"id": "natmat-2026-magnetoelectric-microrobots-spinal-cord", "title": "Magnetoelectric microrobots for spinal cord injury regeneration", "link": "https://www.nature.com/articles/s41563-026-02625-3", "summary": "Researchers at ETH Zurich and the University of Zurich built microscopic biohybrid robots, dubbed NPCbots, by fusing human iPSC-derived neural progenitor cells with magnetoelectric nanoparticles that can be wirelessly steered to an injury site and electrically stimulated using an external magnetic field. In zebrafish with spinal cord injuries, magnetically stimulated NPCbots drove rapid neuronal and glial differentiation and restored near-normal swimming within three days; in mice with fully severed spinal cords, treated animals showed reconnected nerve fibers and markedly improved gait and coordination after 28 days. The approach offers a minimally invasive way to both deliver and precisely activate regenerative stem cells at an injury site without genetic modification.", "journal": "Nature Materials", "year": 2026, "category": "regenerative_medicine", "date_surfaced": "2026-07-27", "retraction_status": "No retraction or correction found. Checked Retraction Watch and PubPeer on 2026-07-27; no entries for this paper or its authors.", "citation_count": 0, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-27", "contradicting_papers": []}, {"id": "nejm-2026-majestec9-teclistamab-myeloma", "title": "Teclistamab in Multiple Myeloma with One to Three Previous Lines of Therapy", "link": "https://www.nejm.org/doi/full/10.1056/NEJMoa2603870", "summary": "In the international phase 3 MajesTEC-9 trial, 593 patients with relapsed multiple myeloma (after 1-3 prior treatments) were randomized to the bispecific T-cell-engaging antibody teclistamab alone versus standard triplet chemo-immunotherapy regimens. Teclistamab monotherapy cut the risk of death by 40% and the risk of progression or death by 71%, with 18-month overall survival of 79.2% versus 68.6% and complete-response rates of 66% versus 17% for standard care. The results suggest bispecific antibodies could replace older combination regimens as early as first relapse in myeloma, a notable finding given that survival benefits are uncommon in myeloma trials at this stage of disease.", "journal": "New England Journal of Medicine", "year": 2026, "category": "clinical_trial", "date_surfaced": "2026-07-27", "retraction_status": "No retraction or correction found. Checked Retraction Watch, PubPeer, and the NEJM article page directly on 2026-07-27; no notices identified.", "citation_count": 5, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-27", "contradicting_papers": [{"title": "Non-relapse mortality with bispecific antibodies: A systematic review and meta-analysis in lymphoma and multiple myeloma", "link": "https://pubmed.ncbi.nlm.nih.gov/40170355/"}, {"title": "Effectiveness and infectious complications of BCMA T-cell engagers in treating multiple myeloma: Real-world evidence from Sweden", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11036077/"}]}, {"id": "natcomms-2026-thalamic-spindle-social-memory-autism", "title": "Dyscoordination of thalamic reticular spindles is associated with social memory deficits in mice and humans with autism spectrum disorder", "link": "https://www.nature.com/articles/s41467-026-75162-x", "summary": "Researchers pinpointed a specific thalamic circuit -- parvalbumin neurons in the sensory thalamic reticular nucleus projecting to the visual thalamus -- that generates the sleep spindles needed to consolidate social memories overnight. In a mouse model of autism (Neuroligin-2 mutants), boosting activity in this circuit with optogenetics restored normal spindles and rescued social memory deficits, while in children, spindle characteristics measured by EEG could be fed into a machine-learning model to help flag autism spectrum disorder. The work links a concrete sleep-circuit mechanism to a hallmark of autism and points toward sleep-based diagnostics and possible circuit-targeted interventions.", "journal": "Nature Communications", "year": 2026, "category": "neuroscience", "date_surfaced": "2026-07-27", "retraction_status": "No retraction or correction found as of 2026-07-27. Checked Retraction Watch and PubPeer for the DOI, authors, and title -- no entries found. Paper was published online 2026-07-23 with no flags on the Nature Communications article page.", "citation_count": 0, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-27", "contradicting_papers": [{"title": "Sleep Spindle Abnormalities in Preschool Children With Autism Spectrum Disability: Insights From Nap Polysomnography", "link": "https://onlinelibrary.wiley.com/doi/10.1002/aur.70087"}]}, {"id": "natelec-2025-bisc-wireless-subdural-bci", "title": "A wireless subdural-contained brain-computer interface with 65,536 electrodes and 1,024 channels", "link": "https://www.nature.com/articles/s41928-025-01509-9", "summary": "Researchers at Columbia, Stanford, Penn, and NewYork-Presbyterian built BISC, a single hair-thin CMOS chip that packs 65,536 recording electrodes, 1,024 simultaneous recording channels, and 16,384 stimulation channels into a device under 3 cubic millimeters -- over 1,000 times smaller than comparable brain implants. The chip sits on the brain's surface (subdural, non-penetrating) and wirelessly streams data at 100 Mbps, roughly 100 times faster than prior wireless brain-computer interfaces. The team validated the device with chronic recordings in animal motor and visual cortex and has begun short-term intraoperative recordings in humans, aiming toward future use in speech, motor, and vision restoration for paralysis, ALS, and blindness.", "journal": "Nature Electronics", "year": 2025, "category": "biomedical_devices", "date_surfaced": "2026-07-27", "retraction_status": "No retraction, correction, or expression of concern found. Checked the journal site, Retraction Watch, and PubPeer as of 2026-07-27 -- none found.", "citation_count": 17, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-27", "contradicting_papers": []}, {"id": "science-2026-synthetic-organizer-kidney-organoids", "title": "Patterning human kidney organoids with synthetic Wnt-secreting organizers", "link": "https://www.science.org/doi/10.1126/science.adu9122", "summary": "Researchers mapped a previously unrecognized WNT11/WNT9B signaling boundary that organizes nephron formation in the developing human kidney, then engineered synthetic 'organizer' cells that secrete tunable amounts of WNT protein inside stem-cell-derived kidney organoids. These synthetic organizers restored the missing spatial cue, driving reproducible, correctly oriented nephron patterning along the proximal-distal axis where organoids previously self-organized chaotically. The approach, validated with single-cell RNA sequencing and spatial transcriptomics, offers a synthetic-biology blueprint for making organoids more faithful models of real organs and a step toward engineering transplantable kidney tissue.", "journal": "Science", "year": 2026, "category": "tissue_engineering", "date_surfaced": "2026-07-27", "retraction_status": "No retraction or correction found. Checked the journal site, Retraction Watch, and PubPeer on 2026-07-27; no records of retraction, correction, or post-publication concerns.", "citation_count": 0, "citation_source": "Semantic Scholar", "citation_checked_date": "2026-07-27", "contradicting_papers": []}]</script>
<script>
(function () {
  var ALL_PAPERS = JSON.parse(document.getElementById('papers-data').textContent);

  var CATEGORY_LABELS = {
    cell_therapy: 'Cell Therapy',
    regenerative_medicine: 'Regenerative Medicine',
    clinical_trial: 'Clinical Trial',
    neuroscience: 'Neuroscience',
    ai_biology: 'AI + Biology',
    biomedical_devices: 'Biomedical Devices',
    tissue_engineering: 'Tissue Engineering',
    gene_therapy: 'Gene Therapy'
  };

  var MARK_WRITE_ENDPOINT = 'https://research-aggregator-marks.lucas-research-aggregator.workers.dev/mark';
  var MARKS_RAW_URL = 'https://raw.githubusercontent.com/lucasrodriggs-tech/research-aggregator/master/data/marks.json';
  var SCHEDULE_WRITE_ENDPOINT = 'https://research-aggregator-marks.lucas-research-aggregator.workers.dev/schedule';
  var SCHEDULE_RAW_URL = 'https://raw.githubusercontent.com/lucasrodriggs-tech/research-aggregator/master/data/schedule.json';

  var FREQUENCY_LABELS = {
    daily: 'Daily',
    every_other_day: 'Every other day',
    twice_weekly: 'Twice a week',
    weekly: 'Once a week',
    biweekly: 'Once every other week',
    custom: 'Custom'
  };

  var DEFAULT_DAYS_BY_FREQUENCY = {
    twice_weekly: ['wed', 'sat'],
    weekly: ['sat'],
    biweekly: ['sat']
  };

  var DAY_LABELS = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  var DAY_ORDER = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

  var DEFAULT_SCHEDULE = {
    count: 10,
    frequency: 'daily',
    days: [],
    custom_dates: [],
    last_delivered_date: null
  };

  var state = {
    tab: 'today',
    category: null,
    archiveDate: null,
    marks: {},
    markError: null,
    expanded: {},
    schedule: DEFAULT_SCHEDULE,
    scheduleEditing: false,
    scheduleError: null
  };

  function loadMarks() {
    return fetch(MARKS_RAW_URL, { cache: 'no-store' })
      .then(function (resp) { return resp.ok ? resp.json() : {}; })
      .catch(function () { return {}; });
  }

  function loadSchedule() {
    return fetch(SCHEDULE_RAW_URL, { cache: 'no-store' })
      .then(function (resp) { return resp.ok ? resp.json() : {}; })
      .then(function (raw) {
        var merged = {};
        Object.keys(DEFAULT_SCHEDULE).forEach(function (key) { merged[key] = DEFAULT_SCHEDULE[key]; });
        Object.keys(raw).forEach(function (key) { merged[key] = raw[key]; });
        return merged;
      })
      .catch(function () { return DEFAULT_SCHEDULE; });
  }

  function shallowCloneSchedule(s) {
    return {
      count: s.count,
      frequency: s.frequency,
      days: s.days.slice(),
      custom_dates: s.custom_dates.slice(),
      last_delivered_date: s.last_delivered_date
    };
  }

  function saveSchedule(next) {
    var previous = state.schedule;
    state.schedule = next;
    state.scheduleError = null;
    render();

    fetch(SCHEDULE_WRITE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        count: next.count,
        frequency: next.frequency,
        days: next.days,
        custom_dates: next.custom_dates
      })
    }).then(function (resp) {
      if (!resp.ok) throw new Error('save failed');
    }).catch(function () {
      state.schedule = previous;
      state.scheduleError = true;
      render();
    });
  }

  function latestDate(papers) {
    var dates = papers.map(function (p) { return p.date_surfaced; });
    if (dates.length === 0) return null;
    return dates.reduce(function (a, b) { return a > b ? a : b; });
  }

  function groupByDate(papers) {
    var groups = {};
    papers.forEach(function (p) {
      (groups[p.date_surfaced] = groups[p.date_surfaced] || []).push(p);
    });
    return groups;
  }

  function renderChips() {
    var chipsEl = document.getElementById('chips');
    chipsEl.innerHTML = '';
    var allBtn = makeChip('All', state.category === null, function () {
      state.category = null;
      render();
    });
    chipsEl.appendChild(allBtn);
    Object.keys(CATEGORY_LABELS).forEach(function (slug) {
      var btn = makeChip(CATEGORY_LABELS[slug], state.category === slug, function () {
        state.category = state.category === slug ? null : slug;
        render();
      });
      chipsEl.appendChild(btn);
    });
  }

  function renderSettingsBar() {
    var summary = document.getElementById('settings-summary');
    var s = state.schedule;
    var plural = s.count === 1 ? '' : 's';
    summary.textContent = s.count + ' paper' + plural + '/delivery · ' + FREQUENCY_LABELS[s.frequency];

    var panel = document.getElementById('settings-panel');
    panel.hidden = !state.scheduleEditing;
    document.getElementById('settings-edit-btn').textContent = state.scheduleEditing ? 'Done' : 'Edit';

    if (!state.scheduleEditing) {
      panel.innerHTML = '';
      return;
    }
    renderSettingsPanel(panel);
  }

  function renderSettingsPanel(panel) {
    panel.innerHTML = '';
    var s = state.schedule;

    var countField = document.createElement('div');
    countField.className = 'field';
    var countLabel = document.createElement('label');
    countLabel.className = 'field-label';
    countLabel.textContent = 'Papers per delivery: ' + s.count;
    var countInput = document.createElement('input');
    countInput.type = 'range';
    countInput.min = '1';
    countInput.max = '10';
    countInput.value = String(s.count);
    countInput.addEventListener('input', function () {
      countLabel.textContent = 'Papers per delivery: ' + countInput.value;
    });
    countInput.addEventListener('change', function () {
      var next = shallowCloneSchedule(s);
      next.count = parseInt(countInput.value, 10);
      saveSchedule(next);
    });
    countField.appendChild(countLabel);
    countField.appendChild(countInput);
    panel.appendChild(countField);

    var freqField = document.createElement('div');
    freqField.className = 'field';
    var freqLabel = document.createElement('label');
    freqLabel.className = 'field-label';
    freqLabel.textContent = 'Frequency';
    var freqSelect = document.createElement('select');
    Object.keys(FREQUENCY_LABELS).forEach(function (key) {
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = FREQUENCY_LABELS[key];
      if (key === s.frequency) opt.selected = true;
      freqSelect.appendChild(opt);
    });
    freqSelect.addEventListener('change', function () {
      var next = shallowCloneSchedule(s);
      next.frequency = freqSelect.value;
      var singleSelectTarget = freqSelect.value === 'weekly' || freqSelect.value === 'biweekly';
      if (DEFAULT_DAYS_BY_FREQUENCY[freqSelect.value]) {
        if (next.days.length === 0) {
          next.days = DEFAULT_DAYS_BY_FREQUENCY[freqSelect.value].slice();
        } else if (singleSelectTarget && next.days.length > 1) {
          next.days = [next.days[0]];
        }
      }
      saveSchedule(next);
    });
    freqField.appendChild(freqLabel);
    freqField.appendChild(freqSelect);
    panel.appendChild(freqField);

    if (s.frequency === 'twice_weekly' || s.frequency === 'weekly' || s.frequency === 'biweekly') {
      var daysField = document.createElement('div');
      daysField.className = 'field';
      var daysLabel = document.createElement('label');
      daysLabel.className = 'field-label';
      daysLabel.textContent = 'Days';
      daysField.appendChild(daysLabel);
      var daysRow = document.createElement('div');
      daysRow.className = 'day-chips';
      var singleSelect = s.frequency !== 'twice_weekly';
      DAY_ORDER.forEach(function (day) {
        var pressed = s.days.indexOf(day) !== -1;
        var chip = makeChip(DAY_LABELS[day], pressed, function () {
          if (singleSelect && pressed) return;
          var next = shallowCloneSchedule(s);
          if (singleSelect) {
            next.days = [day];
          } else {
            if (pressed) {
              next.days = s.days.filter(function (d) { return d !== day; });
            } else {
              next.days = s.days.concat([day]);
            }
          }
          saveSchedule(next);
        });
        daysRow.appendChild(chip);
      });
      daysField.appendChild(daysRow);
      panel.appendChild(daysField);
    }

    if (s.frequency === 'custom') {
      var calField = document.createElement('div');
      calField.className = 'field';
      var calLabel = document.createElement('label');
      calLabel.className = 'field-label';
      calLabel.textContent = 'Delivery days';
      calField.appendChild(calLabel);

      var today = new Date();
      var todayIso = isoDate(today.getFullYear(), today.getMonth(), today.getDate());
      var nextMonthDate = new Date(today.getFullYear(), today.getMonth() + 1, 1);

      function toggleCustomDate(iso) {
        var next = shallowCloneSchedule(s);
        var idx = next.custom_dates.indexOf(iso);
        if (idx === -1) {
          next.custom_dates = next.custom_dates.concat([iso]).sort();
        } else {
          next.custom_dates = next.custom_dates.filter(function (d) { return d !== iso; });
        }
        saveSchedule(next);
      }

      calField.appendChild(renderMonthCalendar(today.getFullYear(), today.getMonth(), todayIso, s.custom_dates, toggleCustomDate));
      calField.appendChild(renderMonthCalendar(nextMonthDate.getFullYear(), nextMonthDate.getMonth(), todayIso, s.custom_dates, toggleCustomDate));

      var clearLink = document.createElement('button');
      clearLink.type = 'button';
      clearLink.className = 'clear-dates-link';
      clearLink.textContent = 'Clear all';
      clearLink.addEventListener('click', function () {
        var next = shallowCloneSchedule(s);
        next.custom_dates = [];
        saveSchedule(next);
      });
      calField.appendChild(clearLink);

      panel.appendChild(calField);
    }

    if (state.scheduleError) {
      var err = document.createElement('div');
      err.className = 'settings-error';
      err.textContent = "Couldn't save, try again";
      panel.appendChild(err);
    }
  }

  function renderDateChips() {
    var dateChipsEl = document.getElementById('date-chips');
    dateChipsEl.innerHTML = '';
    if (state.tab !== 'archive') return;

    var latest = latestDate(ALL_PAPERS);
    var archivePapers = ALL_PAPERS.filter(function (p) { return p.date_surfaced !== latest; });
    var dates = [];
    archivePapers.forEach(function (p) {
      if (dates.indexOf(p.date_surfaced) === -1) dates.push(p.date_surfaced);
    });
    dates.sort().reverse();
    if (dates.length <= 1) return;

    var allBtn = makeChip('All Dates', state.archiveDate === null, function () {
      state.archiveDate = null;
      render();
    });
    dateChipsEl.appendChild(allBtn);
    dates.forEach(function (date) {
      var btn = makeChip(date, state.archiveDate === date, function () {
        state.archiveDate = state.archiveDate === date ? null : date;
        render();
      });
      dateChipsEl.appendChild(btn);
    });
  }

  function daysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function isoDate(year, month, day) {
    return year + '-' + pad2(month + 1) + '-' + pad2(day);
  }

  function buildMonthCells(year, month) {
    var firstWeekday = new Date(year, month, 1).getDay();
    var total = daysInMonth(year, month);
    var cells = [];
    for (var i = 0; i < firstWeekday; i++) cells.push(null);
    for (var d = 1; d <= total; d++) cells.push(d);
    return cells;
  }

  function renderMonthCalendar(year, month, todayIso, selectedDates, onToggle) {
    var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var wrap = document.createElement('div');
    wrap.className = 'calendar-month';
    var heading = document.createElement('div');
    heading.className = 'calendar-heading';
    heading.textContent = monthNames[month] + ' ' + year;
    wrap.appendChild(heading);

    var grid = document.createElement('div');
    grid.className = 'calendar-grid';
    ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(function (label) {
      var head = document.createElement('div');
      head.className = 'calendar-dow';
      head.textContent = label;
      grid.appendChild(head);
    });

    buildMonthCells(year, month).forEach(function (day) {
      var cell = document.createElement('div');
      cell.className = 'calendar-cell';
      if (day === null) {
        cell.classList.add('empty');
      } else {
        var iso = isoDate(year, month, day);
        cell.textContent = String(day);
        if (iso < todayIso) {
          cell.classList.add('disabled');
        } else {
          if (selectedDates.indexOf(iso) !== -1) cell.classList.add('selected');
          cell.addEventListener('click', function () { onToggle(iso); });
        }
      }
      grid.appendChild(cell);
    });

    wrap.appendChild(grid);
    return wrap;
  }

  function makeChip(label, pressed, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.textContent = label;
    btn.setAttribute('aria-pressed', String(pressed));
    btn.addEventListener('click', onClick);
    return btn;
  }

  function markLabel(paperId) {
    return state.marks[paperId];
  }

  function setMark(paperId, value) {
    var previous = state.marks[paperId];
    var next = previous === value ? null : value;

    if (next === null) {
      delete state.marks[paperId];
    } else {
      state.marks[paperId] = next;
    }
    state.markError = null;
    render();

    fetch(MARK_WRITE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paper_id: paperId, mark: next })
    }).then(function (resp) {
      if (!resp.ok) throw new Error('save failed');
    }).catch(function () {
      if (previous === undefined) {
        delete state.marks[paperId];
      } else {
        state.marks[paperId] = previous;
      }
      state.markError = paperId;
      render();
    });
  }

  function renderCard(paper) {
    var card = document.createElement('article');
    card.className = 'card';
    var mark = markLabel(paper.id);
    if (mark === 'not_interested') card.classList.add('marked-skip');
    if (state.expanded[paper.id]) card.classList.add('expanded');

    var head = document.createElement('div');
    head.className = 'card-head';
    head.setAttribute('tabindex', '0');
    head.setAttribute('role', 'button');
    function toggleExpanded() {
      if (state.expanded[paper.id]) {
        delete state.expanded[paper.id];
      } else {
        state.expanded[paper.id] = true;
      }
      card.classList.toggle('expanded');
    }
    head.addEventListener('click', toggleExpanded);
    head.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        toggleExpanded();
      }
    });

    var main = document.createElement('div');
    main.className = 'card-head-main';

    var h2 = document.createElement('h2');
    h2.textContent = paper.title;
    main.appendChild(h2);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var categorySpan = document.createElement('span');
    categorySpan.className = 'tag';
    categorySpan.textContent = CATEGORY_LABELS[paper.category] || paper.category;
    var journalSpan = document.createElement('span');
    journalSpan.textContent = paper.journal + ' · ' + paper.year;
    var citesSpan = document.createElement('span');
    citesSpan.textContent = paper.citation_count.toLocaleString() + ' cites';
    meta.appendChild(categorySpan);
    meta.appendChild(journalSpan);
    meta.appendChild(citesSpan);
    main.appendChild(meta);

    var summary = document.createElement('p');
    summary.className = 'summary';
    summary.textContent = paper.summary;
    main.appendChild(summary);

    var actions = document.createElement('div');
    actions.className = 'actions';
    var usedBtn = document.createElement('button');
    usedBtn.type = 'button';
    usedBtn.textContent = 'Used for video';
    if (mark === 'used') usedBtn.classList.add('active-used');
    usedBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      setMark(paper.id, 'used');
    });
    var skipBtn = document.createElement('button');
    skipBtn.type = 'button';
    skipBtn.textContent = 'Not interested';
    if (mark === 'not_interested') skipBtn.classList.add('active-skip');
    skipBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      setMark(paper.id, 'not_interested');
    });
    actions.appendChild(usedBtn);
    actions.appendChild(skipBtn);
    if (state.markError === paper.id) {
      var errorNote = document.createElement('span');
      errorNote.className = 'mark-error';
      errorNote.textContent = "Couldn't save, try again";
      actions.appendChild(errorNote);
    }
    main.appendChild(actions);

    head.appendChild(main);
    card.appendChild(head);

    var detail = document.createElement('dl');
    detail.className = 'detail';

    var linkDt = document.createElement('dt');
    linkDt.textContent = 'Link';
    var linkDd = document.createElement('dd');
    var a = document.createElement('a');
    a.href = paper.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'outlink';
    a.textContent = paper.link;
    a.addEventListener('click', function (e) { e.stopPropagation(); });
    linkDd.appendChild(a);

    var retractionDt = document.createElement('dt');
    retractionDt.textContent = 'Retraction / correction status';
    var retractionDd = document.createElement('dd');
    retractionDd.textContent = paper.retraction_status;

    var citationDt = document.createElement('dt');
    citationDt.textContent = 'Citation count';
    var citationDd = document.createElement('dd');
    citationDd.textContent = paper.citation_count.toLocaleString() + ' (' + paper.citation_source + ', checked ' + paper.citation_checked_date + ')';

    detail.appendChild(linkDt);
    detail.appendChild(linkDd);
    detail.appendChild(retractionDt);
    detail.appendChild(retractionDd);
    detail.appendChild(citationDt);
    detail.appendChild(citationDd);

    var contraDt = document.createElement('dt');
    contraDt.textContent = 'Contradicting papers';
    detail.appendChild(contraDt);
    var contraDd = document.createElement('dd');
    if (paper.contradicting_papers.length === 0) {
      contraDd.textContent = 'None found';
    } else {
      var ol = document.createElement('ol');
      paper.contradicting_papers.forEach(function (cp) {
        var li = document.createElement('li');
        var cpA = document.createElement('a');
        cpA.href = cp.link;
        cpA.target = '_blank';
        cpA.rel = 'noopener noreferrer';
        cpA.className = 'outlink';
        cpA.textContent = cp.title;
        cpA.addEventListener('click', function (e) { e.stopPropagation(); });
        li.appendChild(cpA);
        ol.appendChild(li);
      });
      contraDd.appendChild(ol);
    }
    detail.appendChild(contraDd);

    card.appendChild(detail);
    return card;
  }

  function currentPapers() {
    var latest = latestDate(ALL_PAPERS);
    var groups = groupByDate(ALL_PAPERS);
    var papers;
    if (state.tab === 'today') {
      papers = latest ? (groups[latest] || []) : [];
    } else {
      papers = ALL_PAPERS.filter(function (p) { return p.date_surfaced !== latest; });
      if (state.archiveDate) {
        papers = papers.filter(function (p) { return p.date_surfaced === state.archiveDate; });
      }
    }
    if (state.category) {
      papers = papers.filter(function (p) { return p.category === state.category; });
    }
    return { papers: papers, latest: latest };
  }

  function render() {
    document.getElementById('tab-today').setAttribute('aria-selected', String(state.tab === 'today'));
    document.getElementById('tab-archive').setAttribute('aria-selected', String(state.tab === 'archive'));
    renderSettingsBar();
    renderChips();
    renderDateChips();

    var feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (ALL_PAPERS.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No digest yet -- check back once the first daily run completes.';
      feed.appendChild(empty);
      document.getElementById('date-line').textContent = '';
      return;
    }

    var result = currentPapers();
    document.getElementById('date-line').textContent = result.latest ? 'Latest digest: ' + result.latest : '';

    if (state.tab === 'today') {
      result.papers.forEach(function (p) { feed.appendChild(renderCard(p)); });
    } else {
      var groups = groupByDate(result.papers);
      Object.keys(groups).sort().reverse().forEach(function (date) {
        var heading = document.createElement('div');
        heading.className = 'archive-date';
        heading.textContent = date;
        feed.appendChild(heading);
        groups[date].forEach(function (p) { feed.appendChild(renderCard(p)); });
      });
    }

    if (result.papers.length === 0) {
      var noResults = document.createElement('div');
      noResults.className = 'empty-state';
      noResults.textContent = 'No papers match this filter.';
      feed.appendChild(noResults);
    }
  }

  document.getElementById('tab-today').addEventListener('click', function () {
    state.tab = 'today';
    render();
  });
  document.getElementById('tab-archive').addEventListener('click', function () {
    state.tab = 'archive';
    render();
  });
  document.getElementById('settings-edit-btn').addEventListener('click', function () {
    state.scheduleEditing = !state.scheduleEditing;
    render();
  });

  loadMarks().then(function (marks) {
    state.marks = marks;
    render();
  });
  loadSchedule().then(function (schedule) {
    state.schedule = schedule;
    render();
  });
})();
</script>
</body>
</html>
