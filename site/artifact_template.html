<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Digest</title>
<style>
  :root {
    --bg: #f1f3f0;
    --surface: #ffffff;
    --ink: #16211d;
    --ink-muted: #5c6b66;
    --line: #d3d9d5;
    --accent: #0d7a72;
    --accent-ink: #ffffff;
    --warn: #b5762a;
    --critical: #a63d34;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'URW Palladio L', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101613; --surface: #182019; --ink: #e6ece8; --ink-muted: #8fa39c;
      --line: #28332e; --accent: #3fd9c7; --accent-ink: #0a1512; --warn: #d99a4e; --critical: #d9695d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101613; --surface: #182019; --ink: #e6ece8; --ink-muted: #8fa39c;
    --line: #28332e; --accent: #3fd9c7; --accent-ink: #0a1512; --warn: #d99a4e; --critical: #d9695d;
  }
  :root[data-theme="light"] {
    --bg: #f1f3f0; --surface: #ffffff; --ink: #16211d; --ink-muted: #5c6b66;
    --line: #d3d9d5; --accent: #0d7a72; --accent-ink: #ffffff; --warn: #b5762a; --critical: #a63d34;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 96px; }
  header.masthead { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
  header.masthead h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.9rem;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  header.masthead .date-line {
    color: var(--ink-muted);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  nav.tabs { display: flex; gap: 4px; margin: 20px 0 12px; }
  nav.tabs button {
    font-family: var(--font-body);
    font-size: 0.9rem;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    padding: 6px 14px;
    cursor: pointer;
  }
  nav.tabs button[aria-selected="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .chip {
    font-family: var(--font-body);
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    background: none;
    padding: 4px 10px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #date-chips:empty { display: none; }
  .settings-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--ink-muted);
    border: 1px solid var(--line);
    padding: 6px 12px;
    margin: 16px 0;
  }
  .settings-bar button {
    font-family: var(--font-body);
    font-size: 0.78rem;
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .settings-panel { border: 1px solid var(--line); padding: 14px; margin: 0 0 16px; }
  .settings-panel[hidden] { display: none; }
  .settings-panel .field { margin-bottom: 14px; }
  .settings-panel .field:last-child { margin-bottom: 0; }
  .settings-panel label.field-label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .settings-panel input[type="range"] { width: 100%; }
  .settings-panel select {
    font-family: var(--font-body);
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .settings-panel .day-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .settings-error { font-size: 0.75rem; color: var(--critical); margin-top: 8px; }
  .calendar-month { margin-top: 10px; }
  .calendar-heading { font-size: 0.8rem; font-weight: 600; text-align: center; margin-bottom: 6px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 0.75rem; }
  .calendar-dow { color: var(--ink-muted); text-transform: uppercase; font-size: 0.65rem; padding: 2px 0; }
  .calendar-cell { padding: 5px 0; border: 1px solid var(--line); cursor: pointer; }
  .calendar-cell.empty { border: none; cursor: default; }
  .calendar-cell.disabled { opacity: 0.3; cursor: not-allowed; }
  .calendar-cell.selected {
    border: 2px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    font-weight: 700;
  }
  .clear-dates-link {
    font-family: var(--font-body);
    font-size: 0.75rem;
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-top: 8px;
  }
  .archive-date {
    font-family: var(--font-body);
    font-size: 0.78rem;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 28px 0 8px;
  }
  .card { border-top: 1px solid var(--line); padding: 18px 0; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .card-head-main { flex: 1; }
  .card h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.15rem;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .card .meta {
    font-size: 0.78rem;
    color: var(--ink-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .card .meta .tag { text-transform: uppercase; letter-spacing: 0.03em; }
  .card p.summary { margin: 0; max-width: 62ch; }
  .card .actions { display: flex; gap: 8px; margin-top: 10px; }
  .card .actions button {
    font-family: var(--font-body);
    font-size: 0.75rem;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    padding: 4px 10px;
    cursor: pointer;
  }
  .card .actions button.active-used { border-color: var(--accent); color: var(--accent); }
  .card .actions button.active-skip { border-color: var(--critical); color: var(--critical); }
  .card .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .actions .mark-error { font-size: 0.75rem; color: var(--critical); align-self: center; }
  .card.marked-skip { opacity: 0.55; }
  .detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 0.85rem; }
  .card.expanded .detail { display: block; }
  .detail dt { color: var(--ink-muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.04em; margin-top: 10px; }
  .detail dt:first-child { margin-top: 0; }
  .detail dd { margin: 2px 0 0; }
  .detail ol { margin: 4px 0 0; padding-left: 20px; }
  .detail a { color: var(--accent); }
  .empty-state { padding: 48px 0; text-align: center; color: var(--ink-muted); font-family: var(--font-display); font-size: 1.1rem; }
  a.outlink { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
  a.outlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Research Digest</h1>
    <div class="date-line" id="date-line"></div>
  </header>

  <div class="settings-bar">
    <span id="settings-summary"></span>
    <button type="button" id="settings-edit-btn">Edit</button>
  </div>
  <div class="settings-panel" id="settings-panel" hidden></div>

  <nav class="tabs" role="tablist">
    <button type="button" id="tab-today" role="tab" aria-selected="true">Today</button>
    <button type="button" id="tab-archive" role="tab" aria-selected="false">Archive</button>
  </nav>

  <div class="chips" id="chips"></div>
  <div class="chips" id="date-chips"></div>

  <main id="feed"></main>
</div>

<script id="papers-data" type="application/json">__PAPERS_DATA__</script>
<script>
(function () {
  var ALL_PAPERS = JSON.parse(document.getElementById('papers-data').textContent);

  var CATEGORY_LABELS = {
    cell_therapy: 'Cell Therapy',
    regenerative_medicine: 'Regenerative Medicine',
    clinical_trial: 'Clinical Trial',
    neuroscience: 'Neuroscience',
    ai_biology: 'AI + Biology',
    biomedical_devices: 'Biomedical Devices',
    tissue_engineering: 'Tissue Engineering',
    gene_therapy: 'Gene Therapy'
  };

  var MARK_WRITE_ENDPOINT = 'https://research-aggregator-marks.lucas-research-aggregator.workers.dev/mark';
  var MARKS_RAW_URL = 'https://raw.githubusercontent.com/lucasrodriggs-tech/research-aggregator/master/data/marks.json';
  var SCHEDULE_WRITE_ENDPOINT = 'https://research-aggregator-marks.lucas-research-aggregator.workers.dev/schedule';
  var SCHEDULE_RAW_URL = 'https://raw.githubusercontent.com/lucasrodriggs-tech/research-aggregator/master/data/schedule.json';

  var FREQUENCY_LABELS = {
    daily: 'Daily',
    every_other_day: 'Every other day',
    twice_weekly: 'Twice a week',
    weekly: 'Once a week',
    biweekly: 'Once every other week',
    custom: 'Custom'
  };

  var DEFAULT_DAYS_BY_FREQUENCY = {
    twice_weekly: ['wed', 'sat'],
    weekly: ['sat'],
    biweekly: ['sat']
  };

  var DAY_LABELS = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  var DAY_ORDER = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

  var DEFAULT_SCHEDULE = {
    count: 10,
    frequency: 'daily',
    days: [],
    custom_dates: [],
    last_delivered_date: null
  };

  var state = {
    tab: 'today',
    category: null,
    archiveDate: null,
    marks: {},
    markError: null,
    expanded: {},
    schedule: DEFAULT_SCHEDULE,
    scheduleEditing: false,
    scheduleError: null
  };

  function loadMarks() {
    return fetch(MARKS_RAW_URL, { cache: 'no-store' })
      .then(function (resp) { return resp.ok ? resp.json() : {}; })
      .catch(function () { return {}; });
  }

  function loadSchedule() {
    return fetch(SCHEDULE_RAW_URL, { cache: 'no-store' })
      .then(function (resp) { return resp.ok ? resp.json() : {}; })
      .then(function (raw) {
        var merged = {};
        Object.keys(DEFAULT_SCHEDULE).forEach(function (key) { merged[key] = DEFAULT_SCHEDULE[key]; });
        Object.keys(raw).forEach(function (key) { merged[key] = raw[key]; });
        return merged;
      })
      .catch(function () { return DEFAULT_SCHEDULE; });
  }

  function shallowCloneSchedule(s) {
    return {
      count: s.count,
      frequency: s.frequency,
      days: s.days.slice(),
      custom_dates: s.custom_dates.slice(),
      last_delivered_date: s.last_delivered_date
    };
  }

  function saveSchedule(next) {
    var previous = state.schedule;
    state.schedule = next;
    state.scheduleError = null;
    render();

    fetch(SCHEDULE_WRITE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        count: next.count,
        frequency: next.frequency,
        days: next.days,
        custom_dates: next.custom_dates
      })
    }).then(function (resp) {
      if (!resp.ok) throw new Error('save failed');
    }).catch(function () {
      state.schedule = previous;
      state.scheduleError = true;
      render();
    });
  }

  function latestDate(papers) {
    var dates = papers.map(function (p) { return p.date_surfaced; });
    if (dates.length === 0) return null;
    return dates.reduce(function (a, b) { return a > b ? a : b; });
  }

  function groupByDate(papers) {
    var groups = {};
    papers.forEach(function (p) {
      (groups[p.date_surfaced] = groups[p.date_surfaced] || []).push(p);
    });
    return groups;
  }

  function renderChips() {
    var chipsEl = document.getElementById('chips');
    chipsEl.innerHTML = '';
    var allBtn = makeChip('All', state.category === null, function () {
      state.category = null;
      render();
    });
    chipsEl.appendChild(allBtn);
    Object.keys(CATEGORY_LABELS).forEach(function (slug) {
      var btn = makeChip(CATEGORY_LABELS[slug], state.category === slug, function () {
        state.category = state.category === slug ? null : slug;
        render();
      });
      chipsEl.appendChild(btn);
    });
  }

  function renderSettingsBar() {
    var summary = document.getElementById('settings-summary');
    var s = state.schedule;
    var plural = s.count === 1 ? '' : 's';
    summary.textContent = s.count + ' paper' + plural + '/delivery · ' + FREQUENCY_LABELS[s.frequency];

    var panel = document.getElementById('settings-panel');
    panel.hidden = !state.scheduleEditing;
    document.getElementById('settings-edit-btn').textContent = state.scheduleEditing ? 'Done' : 'Edit';

    if (!state.scheduleEditing) {
      panel.innerHTML = '';
      return;
    }
    renderSettingsPanel(panel);
  }

  function renderSettingsPanel(panel) {
    panel.innerHTML = '';
    var s = state.schedule;

    var countField = document.createElement('div');
    countField.className = 'field';
    var countLabel = document.createElement('label');
    countLabel.className = 'field-label';
    countLabel.textContent = 'Papers per delivery: ' + s.count;
    var countInput = document.createElement('input');
    countInput.type = 'range';
    countInput.min = '1';
    countInput.max = '10';
    countInput.value = String(s.count);
    countInput.addEventListener('input', function () {
      countLabel.textContent = 'Papers per delivery: ' + countInput.value;
    });
    countInput.addEventListener('change', function () {
      var next = shallowCloneSchedule(s);
      next.count = parseInt(countInput.value, 10);
      saveSchedule(next);
    });
    countField.appendChild(countLabel);
    countField.appendChild(countInput);
    panel.appendChild(countField);

    var freqField = document.createElement('div');
    freqField.className = 'field';
    var freqLabel = document.createElement('label');
    freqLabel.className = 'field-label';
    freqLabel.textContent = 'Frequency';
    var freqSelect = document.createElement('select');
    Object.keys(FREQUENCY_LABELS).forEach(function (key) {
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = FREQUENCY_LABELS[key];
      if (key === s.frequency) opt.selected = true;
      freqSelect.appendChild(opt);
    });
    freqSelect.addEventListener('change', function () {
      var next = shallowCloneSchedule(s);
      next.frequency = freqSelect.value;
      var singleSelectTarget = freqSelect.value === 'weekly' || freqSelect.value === 'biweekly';
      if (DEFAULT_DAYS_BY_FREQUENCY[freqSelect.value]) {
        if (next.days.length === 0) {
          next.days = DEFAULT_DAYS_BY_FREQUENCY[freqSelect.value].slice();
        } else if (singleSelectTarget && next.days.length > 1) {
          next.days = [next.days[0]];
        }
      }
      saveSchedule(next);
    });
    freqField.appendChild(freqLabel);
    freqField.appendChild(freqSelect);
    panel.appendChild(freqField);

    if (s.frequency === 'twice_weekly' || s.frequency === 'weekly' || s.frequency === 'biweekly') {
      var daysField = document.createElement('div');
      daysField.className = 'field';
      var daysLabel = document.createElement('label');
      daysLabel.className = 'field-label';
      daysLabel.textContent = 'Days';
      daysField.appendChild(daysLabel);
      var daysRow = document.createElement('div');
      daysRow.className = 'day-chips';
      var singleSelect = s.frequency !== 'twice_weekly';
      DAY_ORDER.forEach(function (day) {
        var pressed = s.days.indexOf(day) !== -1;
        var chip = makeChip(DAY_LABELS[day], pressed, function () {
          if (singleSelect && pressed) return;
          var next = shallowCloneSchedule(s);
          if (singleSelect) {
            next.days = [day];
          } else {
            if (pressed) {
              next.days = s.days.filter(function (d) { return d !== day; });
            } else {
              next.days = s.days.concat([day]);
            }
          }
          saveSchedule(next);
        });
        daysRow.appendChild(chip);
      });
      daysField.appendChild(daysRow);
      panel.appendChild(daysField);
    }

    if (s.frequency === 'custom') {
      var calField = document.createElement('div');
      calField.className = 'field';
      var calLabel = document.createElement('label');
      calLabel.className = 'field-label';
      calLabel.textContent = 'Delivery days';
      calField.appendChild(calLabel);

      var today = new Date();
      var todayIso = isoDate(today.getFullYear(), today.getMonth(), today.getDate());
      var nextMonthDate = new Date(today.getFullYear(), today.getMonth() + 1, 1);

      function toggleCustomDate(iso) {
        var next = shallowCloneSchedule(s);
        var idx = next.custom_dates.indexOf(iso);
        if (idx === -1) {
          next.custom_dates = next.custom_dates.concat([iso]).sort();
        } else {
          next.custom_dates = next.custom_dates.filter(function (d) { return d !== iso; });
        }
        saveSchedule(next);
      }

      calField.appendChild(renderMonthCalendar(today.getFullYear(), today.getMonth(), todayIso, s.custom_dates, toggleCustomDate));
      calField.appendChild(renderMonthCalendar(nextMonthDate.getFullYear(), nextMonthDate.getMonth(), todayIso, s.custom_dates, toggleCustomDate));

      var clearLink = document.createElement('button');
      clearLink.type = 'button';
      clearLink.className = 'clear-dates-link';
      clearLink.textContent = 'Clear all';
      clearLink.addEventListener('click', function () {
        var next = shallowCloneSchedule(s);
        next.custom_dates = [];
        saveSchedule(next);
      });
      calField.appendChild(clearLink);

      panel.appendChild(calField);
    }

    if (state.scheduleError) {
      var err = document.createElement('div');
      err.className = 'settings-error';
      err.textContent = "Couldn't save, try again";
      panel.appendChild(err);
    }
  }

  function renderDateChips() {
    var dateChipsEl = document.getElementById('date-chips');
    dateChipsEl.innerHTML = '';
    if (state.tab !== 'archive') return;

    var latest = latestDate(ALL_PAPERS);
    var archivePapers = ALL_PAPERS.filter(function (p) { return p.date_surfaced !== latest; });
    var dates = [];
    archivePapers.forEach(function (p) {
      if (dates.indexOf(p.date_surfaced) === -1) dates.push(p.date_surfaced);
    });
    dates.sort().reverse();
    if (dates.length <= 1) return;

    var allBtn = makeChip('All Dates', state.archiveDate === null, function () {
      state.archiveDate = null;
      render();
    });
    dateChipsEl.appendChild(allBtn);
    dates.forEach(function (date) {
      var btn = makeChip(date, state.archiveDate === date, function () {
        state.archiveDate = state.archiveDate === date ? null : date;
        render();
      });
      dateChipsEl.appendChild(btn);
    });
  }

  function daysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function isoDate(year, month, day) {
    return year + '-' + pad2(month + 1) + '-' + pad2(day);
  }

  function buildMonthCells(year, month) {
    var firstWeekday = new Date(year, month, 1).getDay();
    var total = daysInMonth(year, month);
    var cells = [];
    for (var i = 0; i < firstWeekday; i++) cells.push(null);
    for (var d = 1; d <= total; d++) cells.push(d);
    return cells;
  }

  function renderMonthCalendar(year, month, todayIso, selectedDates, onToggle) {
    var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var wrap = document.createElement('div');
    wrap.className = 'calendar-month';
    var heading = document.createElement('div');
    heading.className = 'calendar-heading';
    heading.textContent = monthNames[month] + ' ' + year;
    wrap.appendChild(heading);

    var grid = document.createElement('div');
    grid.className = 'calendar-grid';
    ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(function (label) {
      var head = document.createElement('div');
      head.className = 'calendar-dow';
      head.textContent = label;
      grid.appendChild(head);
    });

    buildMonthCells(year, month).forEach(function (day) {
      var cell = document.createElement('div');
      cell.className = 'calendar-cell';
      if (day === null) {
        cell.classList.add('empty');
      } else {
        var iso = isoDate(year, month, day);
        cell.textContent = String(day);
        if (iso < todayIso) {
          cell.classList.add('disabled');
        } else {
          if (selectedDates.indexOf(iso) !== -1) cell.classList.add('selected');
          cell.addEventListener('click', function () { onToggle(iso); });
        }
      }
      grid.appendChild(cell);
    });

    wrap.appendChild(grid);
    return wrap;
  }

  function makeChip(label, pressed, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.textContent = label;
    btn.setAttribute('aria-pressed', String(pressed));
    btn.addEventListener('click', onClick);
    return btn;
  }

  function markLabel(paperId) {
    return state.marks[paperId];
  }

  function setMark(paperId, value) {
    var previous = state.marks[paperId];
    var next = previous === value ? null : value;

    if (next === null) {
      delete state.marks[paperId];
    } else {
      state.marks[paperId] = next;
    }
    state.markError = null;
    render();

    fetch(MARK_WRITE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paper_id: paperId, mark: next })
    }).then(function (resp) {
      if (!resp.ok) throw new Error('save failed');
    }).catch(function () {
      if (previous === undefined) {
        delete state.marks[paperId];
      } else {
        state.marks[paperId] = previous;
      }
      state.markError = paperId;
      render();
    });
  }

  function renderCard(paper) {
    var card = document.createElement('article');
    card.className = 'card';
    var mark = markLabel(paper.id);
    if (mark === 'not_interested') card.classList.add('marked-skip');
    if (state.expanded[paper.id]) card.classList.add('expanded');

    var head = document.createElement('div');
    head.className = 'card-head';
    head.setAttribute('tabindex', '0');
    head.setAttribute('role', 'button');
    function toggleExpanded() {
      if (state.expanded[paper.id]) {
        delete state.expanded[paper.id];
      } else {
        state.expanded[paper.id] = true;
      }
      card.classList.toggle('expanded');
    }
    head.addEventListener('click', toggleExpanded);
    head.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        toggleExpanded();
      }
    });

    var main = document.createElement('div');
    main.className = 'card-head-main';

    var h2 = document.createElement('h2');
    h2.textContent = paper.title;
    main.appendChild(h2);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var categorySpan = document.createElement('span');
    categorySpan.className = 'tag';
    categorySpan.textContent = CATEGORY_LABELS[paper.category] || paper.category;
    var journalSpan = document.createElement('span');
    journalSpan.textContent = paper.journal + ' · ' + paper.year;
    var citesSpan = document.createElement('span');
    citesSpan.textContent = paper.citation_count.toLocaleString() + ' cites';
    meta.appendChild(categorySpan);
    meta.appendChild(journalSpan);
    meta.appendChild(citesSpan);
    main.appendChild(meta);

    var summary = document.createElement('p');
    summary.className = 'summary';
    summary.textContent = paper.summary;
    main.appendChild(summary);

    var actions = document.createElement('div');
    actions.className = 'actions';
    var usedBtn = document.createElement('button');
    usedBtn.type = 'button';
    usedBtn.textContent = 'Used for video';
    if (mark === 'used') usedBtn.classList.add('active-used');
    usedBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      setMark(paper.id, 'used');
    });
    var skipBtn = document.createElement('button');
    skipBtn.type = 'button';
    skipBtn.textContent = 'Not interested';
    if (mark === 'not_interested') skipBtn.classList.add('active-skip');
    skipBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      setMark(paper.id, 'not_interested');
    });
    actions.appendChild(usedBtn);
    actions.appendChild(skipBtn);
    if (state.markError === paper.id) {
      var errorNote = document.createElement('span');
      errorNote.className = 'mark-error';
      errorNote.textContent = "Couldn't save, try again";
      actions.appendChild(errorNote);
    }
    main.appendChild(actions);

    head.appendChild(main);
    card.appendChild(head);

    var detail = document.createElement('dl');
    detail.className = 'detail';

    var linkDt = document.createElement('dt');
    linkDt.textContent = 'Link';
    var linkDd = document.createElement('dd');
    var a = document.createElement('a');
    a.href = paper.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'outlink';
    a.textContent = paper.link;
    a.addEventListener('click', function (e) { e.stopPropagation(); });
    linkDd.appendChild(a);

    var retractionDt = document.createElement('dt');
    retractionDt.textContent = 'Retraction / correction status';
    var retractionDd = document.createElement('dd');
    retractionDd.textContent = paper.retraction_status;

    var citationDt = document.createElement('dt');
    citationDt.textContent = 'Citation count';
    var citationDd = document.createElement('dd');
    citationDd.textContent = paper.citation_count.toLocaleString() + ' (' + paper.citation_source + ', checked ' + paper.citation_checked_date + ')';

    detail.appendChild(linkDt);
    detail.appendChild(linkDd);
    detail.appendChild(retractionDt);
    detail.appendChild(retractionDd);
    detail.appendChild(citationDt);
    detail.appendChild(citationDd);

    var contraDt = document.createElement('dt');
    contraDt.textContent = 'Contradicting papers';
    detail.appendChild(contraDt);
    var contraDd = document.createElement('dd');
    if (paper.contradicting_papers.length === 0) {
      contraDd.textContent = 'None found';
    } else {
      var ol = document.createElement('ol');
      paper.contradicting_papers.forEach(function (cp) {
        var li = document.createElement('li');
        var cpA = document.createElement('a');
        cpA.href = cp.link;
        cpA.target = '_blank';
        cpA.rel = 'noopener noreferrer';
        cpA.className = 'outlink';
        cpA.textContent = cp.title;
        cpA.addEventListener('click', function (e) { e.stopPropagation(); });
        li.appendChild(cpA);
        ol.appendChild(li);
      });
      contraDd.appendChild(ol);
    }
    detail.appendChild(contraDd);

    card.appendChild(detail);
    return card;
  }

  function currentPapers() {
    var latest = latestDate(ALL_PAPERS);
    var groups = groupByDate(ALL_PAPERS);
    var papers;
    if (state.tab === 'today') {
      papers = latest ? (groups[latest] || []) : [];
    } else {
      papers = ALL_PAPERS.filter(function (p) { return p.date_surfaced !== latest; });
      if (state.archiveDate) {
        papers = papers.filter(function (p) { return p.date_surfaced === state.archiveDate; });
      }
    }
    if (state.category) {
      papers = papers.filter(function (p) { return p.category === state.category; });
    }
    return { papers: papers, latest: latest };
  }

  function render() {
    document.getElementById('tab-today').setAttribute('aria-selected', String(state.tab === 'today'));
    document.getElementById('tab-archive').setAttribute('aria-selected', String(state.tab === 'archive'));
    renderSettingsBar();
    renderChips();
    renderDateChips();

    var feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (ALL_PAPERS.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No digest yet -- check back once the first daily run completes.';
      feed.appendChild(empty);
      document.getElementById('date-line').textContent = '';
      return;
    }

    var result = currentPapers();
    document.getElementById('date-line').textContent = result.latest ? 'Latest digest: ' + result.latest : '';

    if (state.tab === 'today') {
      result.papers.forEach(function (p) { feed.appendChild(renderCard(p)); });
    } else {
      var groups = groupByDate(result.papers);
      Object.keys(groups).sort().reverse().forEach(function (date) {
        var heading = document.createElement('div');
        heading.className = 'archive-date';
        heading.textContent = date;
        feed.appendChild(heading);
        groups[date].forEach(function (p) { feed.appendChild(renderCard(p)); });
      });
    }

    if (result.papers.length === 0) {
      var noResults = document.createElement('div');
      noResults.className = 'empty-state';
      noResults.textContent = 'No papers match this filter.';
      feed.appendChild(noResults);
    }
  }

  document.getElementById('tab-today').addEventListener('click', function () {
    state.tab = 'today';
    render();
  });
  document.getElementById('tab-archive').addEventListener('click', function () {
    state.tab = 'archive';
    render();
  });
  document.getElementById('settings-edit-btn').addEventListener('click', function () {
    state.scheduleEditing = !state.scheduleEditing;
    render();
  });

  loadMarks().then(function (marks) {
    state.marks = marks;
    render();
  });
  loadSchedule().then(function (schedule) {
    state.schedule = schedule;
    render();
  });
})();
</script>
</body>
</html>
